services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: afyabridge
      POSTGRES_USER: afyabridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - afyabridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyabridge -d afyabridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afyabridge_postgres_data:
