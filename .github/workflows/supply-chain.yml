name: Supply chain

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "security/supply-chain-revocations.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/web/Dockerfile"
      - ".dockerignore"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "infra/terraform/modules/cloud-run-service/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Build and validate supply-chain evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify immutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r reference; do
            case "$reference" in
              ./*|docker://*)
                continue
                ;;
            esac
            ref="${reference##*@}"
            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Mutable workflow dependency: $reference" >&2
              violations=1
            fi
          done < <(
            grep -RhE '^[[:space:]]*uses:[[:space:]]*[^[:space:]#]+' .github/workflows \
              | sed -E 's/^[[:space:]]*uses:[[:space:]]*//' \
              | sed -E 's/[[:space:]]+#.*$//' \
              | sort -u
          )
          test "$violations" -eq 0

      - name: Prepare supply-chain evidence directory
        run: mkdir -p supply-chain-evidence

      - name: Validate build, signing, deploy, and runtime identity boundaries
        run: node scripts/validate-supply-chain-identities.mjs | tee supply-chain-evidence/identity-boundary-validation.txt

      - name: Validate dependency risk and evidence governance
        run: node scripts/validate-supply-chain-governance.mjs | tee supply-chain-evidence/governance-validation.txt

      - name: Validate trust revocation registry
        run: node scripts/check-supply-chain-revocation.mjs | tee supply-chain-evidence/revocation-registry-validation.txt

      - name: Run supply-chain compromise tests
        run: node scripts/test-supply-chain-compromise-controls.mjs | tee supply-chain-evidence/compromise-tests.txt

      - name: Snapshot trust revocation policy
        run: cp security/supply-chain-revocations.json supply-chain-evidence/revocations.json

      - name: Generate repository CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: supply-chain-evidence/source.cdx.json
          hide-progress: true

      - name: Generate repository SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: supply-chain-evidence/source.spdx.json
          hide-progress: true

      - name: Build web application image
        run: docker build --file apps/web/Dockerfile --tag afyabridge-web:${{ github.sha }} .

      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: afyabridge-web:${{ github.sha }}
          format: cyclonedx
          output: supply-chain-evidence/image.cdx.json
          hide-progress: true

      - name: Generate image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: afyabridge-web:${{ github.sha }}
          format: spdx-json
          output: supply-chain-evidence/image.spdx.json
          hide-progress: true

      - name: Validate SBOM structure
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' supply-chain-evidence/source.cdx.json >/dev/null
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' supply-chain-evidence/image.cdx.json >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' supply-chain-evidence/source.spdx.json >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' supply-chain-evidence/image.spdx.json >/dev/null
          test -s supply-chain-evidence/source.cdx.json
          test -s supply-chain-evidence/source.spdx.json
          test -s supply-chain-evidence/image.cdx.json
          test -s supply-chain-evidence/image.spdx.json

      - name: Export exact web image artifact
        shell: bash
        run: |
          set -euo pipefail
          image_tar="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          docker save --output "$image_tar" "afyabridge-web:${GITHUB_SHA}"
          test -s "$image_tar"

      - name: Record build artifact metadata
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format='{{.Id}}' "afyabridge-web:${GITHUB_SHA}")"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg image_id "$image_id" \
            --arg artifact "afyabridge-web-${GITHUB_SHA}.tar" \
            '{
              repository: $repository,
              commit: $commit,
              source_commit: $source_commit,
              ref: $ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              image_id: $image_id,
              artifact: $artifact
            }' > supply-chain-evidence/build-metadata.json

      - name: Record artifact digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            supply-chain-evidence/source.cdx.json \
            supply-chain-evidence/source.spdx.json \
            supply-chain-evidence/image.cdx.json \
            supply-chain-evidence/image.spdx.json \
            supply-chain-evidence/build-metadata.json \
            supply-chain-evidence/revocations.json \
            supply-chain-evidence/identity-boundary-validation.txt \
            supply-chain-evidence/governance-validation.txt \
            supply-chain-evidence/revocation-registry-validation.txt \
            supply-chain-evidence/compromise-tests.txt \
            "supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar" \
            | tee supply-chain-evidence/SHA256SUMS

      - name: Publish build evidence summary
        shell: bash
        run: |
          {
            echo "## Supply-chain build evidence"
            echo
            echo "Built the web image, exported the exact image bytes, generated CycloneDX/SPDX SBOMs, and validated dependency, retention, revocation, and compromise controls before any signing identity was granted."
            echo
            echo '```text'
            cat supply-chain-evidence/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-build-${{ github.sha }}
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Sign and verify provenance
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out exact trust policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download unsigned build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-build-${{ github.sha }}
          path: supply-chain-evidence

      - name: Verify build evidence handoff
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check supply-chain-evidence/SHA256SUMS
          cmp security/supply-chain-revocations.json supply-chain-evidence/revocations.json
          test "$(jq -r '.repository' supply-chain-evidence/build-metadata.json)" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.commit' supply-chain-evidence/build-metadata.json)" = "${GITHUB_SHA}"
          test "$(jq -r '.source_commit' supply-chain-evidence/build-metadata.json)" = "${SOURCE_COMMIT}"
          test "$(jq -r '.ref' supply-chain-evidence/build-metadata.json)" = "${GITHUB_REF}"
          test "$(jq -r '.run_id' supply-chain-evidence/build-metadata.json)" = "${GITHUB_RUN_ID}"
          test "$(jq -r '.run_attempt' supply-chain-evidence/build-metadata.json)" = "${GITHUB_RUN_ATTEMPT}"
          test "$(jq -r '.artifact' supply-chain-evidence/build-metadata.json)" = "afyabridge-web-${GITHUB_SHA}.tar"

      - name: Enforce revocation policy before signing
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p supply-chain-signing-evidence
          artifact="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          artifact_digest="$(sha256sum "$artifact" | awk '{print $1}')"
          workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@${GITHUB_REF}"
          node scripts/check-supply-chain-revocation.mjs \
            --source-sha "$SOURCE_COMMIT" \
            --artifact-sha256 "$artifact_digest" \
            --workflow-identity "$workflow_identity" \
            | tee supply-chain-signing-evidence/revocation-pre-sign.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign exact image artifact with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          artifact="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          cosign sign-blob "$artifact" \
            --bundle supply-chain-signing-evidence/afyabridge-web.sigstore.json \
            --yes

      - name: Verify Cosign signature and workflow identity
        shell: bash
        run: |
          set -euo pipefail
          artifact="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@${GITHUB_REF}"
          cosign verify-blob "$artifact" \
            --bundle supply-chain-signing-evidence/afyabridge-web.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | tee supply-chain-signing-evidence/cosign-verification.txt

      - name: Generate GitHub build provenance
        id: provenance-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: supply-chain-evidence/SHA256SUMS

      - name: Generate GitHub SBOM attestation
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: supply-chain-evidence/afyabridge-web-${{ github.sha }}.tar
          sbom-path: supply-chain-evidence/image.spdx.json

      - name: Preserve GitHub attestation bundles
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance-attestation.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" supply-chain-signing-evidence/github-provenance.sigstore.json
          cp "$SBOM_BUNDLE" supply-chain-signing-evidence/github-sbom.sigstore.json

      - name: Verify GitHub provenance and SBOM attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml"

          gh attestation verify "$artifact" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --deny-self-hosted-runners \
            --format json \
            > supply-chain-signing-evidence/github-provenance-verification.json

          gh attestation verify "$artifact" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --deny-self-hosted-runners \
            --format json \
            > supply-chain-signing-evidence/github-sbom-verification.json

          jq -e 'length > 0' supply-chain-signing-evidence/github-provenance-verification.json >/dev/null
          jq -e 'length > 0' supply-chain-signing-evidence/github-sbom-verification.json >/dev/null

      - name: Re-check revocation policy after verification
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          artifact="supply-chain-evidence/afyabridge-web-${GITHUB_SHA}.tar"
          artifact_digest="$(sha256sum "$artifact" | awk '{print $1}')"
          workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@${GITHUB_REF}"
          node scripts/check-supply-chain-revocation.mjs \
            --source-sha "$SOURCE_COMMIT" \
            --artifact-sha256 "$artifact_digest" \
            --workflow-identity "$workflow_identity" \
            | tee supply-chain-signing-evidence/revocation-post-verify.txt

      - name: Record signing evidence digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum supply-chain-signing-evidence/* \
            | tee supply-chain-signing-evidence/SHA256SUMS

      - name: Publish provenance summary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Signed supply-chain provenance"
            echo
            echo "Verified the exact exported image artifact with both a keyless Sigstore Cosign signature and GitHub artifact attestations, with the current revocation policy enforced before signing and after verification."
            echo
            echo "Signer workflow: \`${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@${GITHUB_REF}\`"
            echo
            echo "Source commit: \`${SOURCE_COMMIT}\`"
            echo
            echo "Workflow execution SHA: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            cat supply-chain-signing-evidence/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signing and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-provenance-${{ github.sha }}
          path: supply-chain-signing-evidence/
          if-no-files-found: error
          retention-days: 90
