name: Terraform foundation first apply

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string
      operation:
        description: Check the saved plan or apply the reviewed hierarchy
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-foundation-live-plan
  cancel-in-progress: false

jobs:
  hierarchy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: foundation-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      OPERATION: ${{ inputs.operation }}
      FOUNDATION_PROVIDER: ${{ vars.GCP_FOUNDATION_APPLY_PROVIDER }}
      FOUNDATION_SERVICE_ACCOUNT: ${{ vars.GCP_FOUNDATION_APPLY_SERVICE_ACCOUNT }}
      GOOGLE_BILLING_PROJECT: ${{ vars.GCP_FEDERATION_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KMS_KEY: ${{ vars.GCP_TERRAFORM_STATE_KMS_KEY }}
      TF_VAR_organization_id: ${{ vars.GCP_FOUNDATION_ORGANIZATION_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_FOUNDATION_BILLING_ACCOUNT_ID }}

    steps:
      - name: Verify deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$OPERATION" == plan || "$OPERATION" == apply ]]
          [[ "$TF_VAR_organization_id" == 694406144491 ]]
          [[ "$TF_STATE_BUCKET" == afyabridge-tfstate-49662756213 ]]
          [[ "$GOOGLE_BILLING_PROJECT" == afyabridge-bootstrap-260808-lm ]]
          [[ "$FOUNDATION_PROVIDER" == projects/49662756213/locations/global/workloadIdentityPools/github-foundation-apply/providers/github ]]
          [[ "$FOUNDATION_SERVICE_ACCOUNT" == terraform-foundation-apply@afyabridge-bootstrap-260808-lm.iam.gserviceaccount.com ]]
          [[ -n "$TF_STATE_KMS_KEY" && -n "$TF_VAR_billing_account_id" ]]

      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Authenticate through dedicated foundation apply trust
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_FEDERATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_APPLY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_APPLY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify and optionally apply the seven-resource plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=infra/terraform/environments/foundation
          plan="$RUNNER_TEMP/foundation-first.tfplan"
          log="$RUNNER_TEMP/foundation-first.log"
          run_phase() {
            local phase="$1"
            shift
            if ! "$@" > "$log" 2>&1; then
              echo "::error::Foundation $phase failed. Raw output withheld."
              return 1
            fi
          }

          run_phase initialization terraform -chdir="$root" init -lockfile=readonly \
            -reconfigure -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=foundation/project-factory" \
            -backend-config="kms_encryption_key=$TF_STATE_KMS_KEY"
          run_phase validation terraform -chdir="$root" validate -no-color
          run_phase planning terraform -chdir="$root" plan -input=false -lock-timeout=2m \
            -no-color -var-file=hierarchy-validation.tfvars.example -out="$plan"
          terraform -chdir="$root" show -json "$plan" 2>> "$log" \
            | jq -e '
                .applyable == true and .complete == true and .errored == false and
                (.resource_changes | length == 7 and all(.mode == "managed" and .change.actions == ["create"]))
              ' > /dev/null

          terraform -chdir="$root" show -json "$plan" 2>> "$log" \
            | node scripts/summarize-foundation-plan.mjs > /dev/null

          checksum="$(sha256sum "$plan" | cut -d " " -f 1)"
          printf '## Foundation first apply\n\nCommit: `%s`\n\nVerified seven creates. Saved plan SHA-256: `%s`\n' \
            "$GITHUB_SHA" "$checksum" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OPERATION" == plan ]]; then
            echo "Plan check completed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          run_phase apply terraform -chdir="$root" apply -input=false -lock-timeout=2m -no-color "$plan"
          echo "Applied the verified saved plan." >> "$GITHUB_STEP_SUMMARY"
          run_phase convergence terraform -chdir="$root" plan -input=false -lock-timeout=2m \
            -no-color -detailed-exitcode -var-file=hierarchy-validation.tfvars.example
          echo "Post-apply plan reported no changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient plan and credentials
        if: always()
        shell: bash
        env:
          CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          rm -f "$RUNNER_TEMP/foundation-first.tfplan" "$RUNNER_TEMP/foundation-first.log"
          if [[ -n "$CREDENTIALS_FILE" ]]; then rm -f "$CREDENTIALS_FILE"; fi
