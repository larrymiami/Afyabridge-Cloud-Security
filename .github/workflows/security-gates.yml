name: Security gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Block vulnerable or disallowed dependency additions
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          warn-only: false

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}

  iac:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          hide-progress: true

  packages:
    name: Package vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          hide-progress: true

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build web application image
        run: docker build --file apps/web/Dockerfile --tag afyabridge-web:${{ github.sha }} .

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: afyabridge-web:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          hide-progress: true

  api-contract:
    name: API contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate OpenAPI contract and route drift
        run: node scripts/validate-api-contract.mjs

  policy-as-code:
    name: OPA policy as code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPA_VERSION: v1.17.0
      OPA_LINUX_AMD64_STATIC_SHA256: e83da46804832578e9d9e1733dffbe4d3b5f8cc9c26eb124da9ceea4abfe189f

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install checksum-verified OPA
        shell: bash
        run: |
          set -euo pipefail
          opa_bin="$RUNNER_TEMP/opa-bin"
          mkdir -p "$opa_bin"
          curl --fail --silent --show-error --location \
            --output "$opa_bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_LINUX_AMD64_STATIC_SHA256}  $opa_bin/opa" | sha256sum --check --strict
          chmod 0755 "$opa_bin/opa"
          echo "$opa_bin" >> "$GITHUB_PATH"

      - name: Validate Rego formatting
        run: opa fmt --fail --diff security/policies/*.rego

      - name: Run Rego unit tests
        run: opa test security/policies --verbose

      - name: Build repository policy input
        run: node scripts/build-policy-input.mjs --output "$RUNNER_TEMP/afyabridge-policy-input.json"

      - name: Evaluate repository policy
        shell: bash
        run: |
          set -euo pipefail
          opa eval \
            --format=pretty \
            --data security/policies/repository.rego \
            --input "$RUNNER_TEMP/afyabridge-policy-input.json" \
            'data.afyabridge.ci.deny'
          opa eval \
            --fail-defined \
            --format=pretty \
            --data security/policies/repository.rego \
            --input "$RUNNER_TEMP/afyabridge-policy-input.json" \
            'data.afyabridge.ci.deny[_]'

  exceptions:
    name: Security exception validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate exception registry
        run: node scripts/validate-security-exceptions.mjs security/exceptions.json

  evidence:
    name: Security gate evidence
    if: always()
    needs:
      - secrets
      - dependency-review
      - codeql
      - iac
      - packages
      - container
      - api-contract
      - policy-as-code
      - exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate machine-readable and human-readable evidence
        env:
          SECURITY_GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/generate-security-evidence.mjs security-evidence

      - name: Publish workflow summary
        run: cat security-evidence/security-gates.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30
