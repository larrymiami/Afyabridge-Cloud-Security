name: Terraform foundation

on:
  pull_request:
    paths:
      - ".terraform-version"
      - "infra/terraform/**"
      - ".github/workflows/terraform-foundation.yml"
  push:
    branches:
      - main
    paths:
      - ".terraform-version"
      - "infra/terraform/**"
      - ".github/workflows/terraform-foundation.yml"

permissions:
  contents: read

concurrency:
  group: terraform-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive infra/terraform

      - name: Initialize bootstrap configuration
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate bootstrap configuration
        run: terraform -chdir=infra/terraform/bootstrap validate -no-color

      - name: Initialize foundation configuration
        run: terraform -chdir=infra/terraform/environments/foundation init -backend=false -input=false -lockfile=readonly

      - name: Validate foundation configuration
        run: terraform -chdir=infra/terraform/environments/foundation validate -no-color

      - name: Initialize network configuration
        run: terraform -chdir=infra/terraform/environments/network init -backend=false -input=false -lockfile=readonly

      - name: Validate network configuration
        run: terraform -chdir=infra/terraform/environments/network validate -no-color

      - name: Initialize workload configuration
        run: terraform -chdir=infra/terraform/environments/workloads init -backend=false -input=false -lockfile=readonly

      - name: Validate workload configuration
        run: terraform -chdir=infra/terraform/environments/workloads validate -no-color

      - name: Initialize federation configuration
        run: terraform -chdir=infra/terraform/environments/federation init -backend=false -input=false -lockfile=readonly

      - name: Validate federation configuration
        run: terraform -chdir=infra/terraform/environments/federation validate -no-color

      - name: Initialize observability configuration
        run: terraform -chdir=infra/terraform/environments/observability init -backend=false -input=false -lockfile=readonly

      - name: Validate observability configuration
        run: terraform -chdir=infra/terraform/environments/observability validate -no-color

      - name: Initialize edge configuration
        run: terraform -chdir=infra/terraform/environments/edge init -backend=false -input=false -lockfile=readonly

      - name: Validate edge configuration
        run: terraform -chdir=infra/terraform/environments/edge validate -no-color
