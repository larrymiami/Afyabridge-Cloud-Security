name: Terraform federation plan

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-federation-plan.yml"

permissions:
  contents: read

jobs:
  negative-plan-cannot-assume-apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.GCP_FEDERATION_PROJECT_ID != '' &&
      vars.GCP_WIF_APPLY_PROVIDER != '' &&
      vars.GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attempt apply identity from plan workflow
        id: apply-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_FEDERATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_APPLY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Assert apply identity is blocked
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.apply-auth.outcome }}" = "failure"
          echo "Apply WIF authentication was rejected as expected." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated credentials
        if: always()
        shell: bash
        run: |
          credentials_file="${{ steps.apply-auth.outputs.credentials_file_path }}"
          if [[ -n "$credentials_file" ]]; then
            rm -f "$credentials_file"
          fi
