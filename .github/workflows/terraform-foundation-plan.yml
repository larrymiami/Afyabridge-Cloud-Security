name: Terraform foundation live plan

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-foundation-live-plan
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: foundation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FOUNDATION_PROJECT: ${{ vars.GCP_FEDERATION_PROJECT_ID }}
      FOUNDATION_PROVIDER: ${{ vars.GCP_FOUNDATION_PLAN_PROVIDER }}
      FOUNDATION_SERVICE_ACCOUNT: ${{ vars.GCP_FOUNDATION_PLAN_SERVICE_ACCOUNT }}
      TF_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KMS_KEY: ${{ vars.GCP_TERRAFORM_STATE_KMS_KEY }}
      TF_VAR_organization_id: ${{ vars.GCP_FOUNDATION_ORGANIZATION_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_FOUNDATION_BILLING_ACCOUNT_ID }}

    steps:
      - name: Verify reviewed execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          for setting in FOUNDATION_PROJECT FOUNDATION_PROVIDER FOUNDATION_SERVICE_ACCOUNT TF_STATE_BUCKET TF_STATE_KMS_KEY TF_VAR_organization_id TF_VAR_billing_account_id; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing foundation setting: $setting"
              exit 1
            fi
          done

      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate through dedicated foundation plan trust
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_FEDERATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate and plan hierarchy only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=infra/terraform/environments/foundation
          log="$RUNNER_TEMP/foundation-plan.log"
          if ! (
            terraform fmt -check -recursive infra/terraform &&
            terraform -chdir=infra/terraform/environments/foundation init -lockfile=readonly -reconfigure -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="prefix=foundation/project-factory" \
              -backend-config="kms_encryption_key=${TF_STATE_KMS_KEY}" &&
            terraform -chdir="$root" validate -no-color &&
            terraform -chdir="$root" plan -input=false -lock=false -refresh=true -no-color \
              -var-file=hierarchy-validation.tfvars.example -out=foundation.tfplan
          ) > "$log" 2>&1; then
            echo "::error::Foundation planning failed. Do not grant broader roles or print raw plan/state; investigate through the approved operator path."
            exit 1
          fi
          terraform -chdir="$root" show -json foundation.tfplan 2>> "$log" \
            | node scripts/summarize-foundation-plan.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient planning material
        if: always()
        shell: bash
        env:
          CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          rm -f infra/terraform/environments/foundation/foundation.tfplan
          rm -f "$RUNNER_TEMP/foundation-plan.log"
          if [[ -n "$CREDENTIALS_FILE" ]]; then rm -f "$CREDENTIALS_FILE"; fi
