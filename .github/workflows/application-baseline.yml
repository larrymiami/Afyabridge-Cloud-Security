name: Application baseline

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/application-baseline.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afyabridge
          POSTGRES_USER: afyabridge
          POSTGRES_PASSWORD: afyabridge-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afyabridge -d afyabridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ENV: development
      APP_COUNTRY: KE
      APP_BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://afyabridge:afyabridge-local-only@127.0.0.1:5432/afyabridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed synthetic data
        run: pnpm db:seed

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
