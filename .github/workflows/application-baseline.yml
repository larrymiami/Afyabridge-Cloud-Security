name: Application baseline

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/application-baseline.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
        env:
          POSTGRES_DB: afyabridge
          POSTGRES_USER: afyabridge
          POSTGRES_PASSWORD: afyabridge-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afyabridge -d afyabridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ENV: development
      APP_COUNTRY: KE
      APP_BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://afyabridge:afyabridge-local-only@127.0.0.1:5432/afyabridge

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Verify build tool versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$(pnpm --version)" = "10.14.0"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed synthetic data
        run: pnpm db:seed

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
